<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fila do Salgado</title>
</head>

<body>

    <h1>🎮 Fila do Salgado</h1>

    <input
        id="nome"
        type="text"
        placeholder="Digite seu nome"
    >

    <button
        id="entrar"
        type="button"
    >
        ENTRAR NA FILA
    </button>

    <p id="resultado">
        Aguardando...
    </p>


    <script>

        window.onload = function () {

            var botao = document.getElementById("entrar");
            var campo = document.getElementById("nome");
            var resultado = document.getElementById("resultado");

            botao.onclick = function () {

                var nome = campo.value;

                if (nome === "") {

                    resultado.innerHTML =
                        "⚠️ Digite um nome primeiro!";

                    return;
                }

                resultado.innerHTML =
                    "🎉 " + nome + " entrou na fila!";

            };

        };

    </script>

</body>

</html>
