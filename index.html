<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Teste Salgado</title>
</head>

<body>

    <h1>🎮 Fila do Salgado</h1>

    <input
        id="nome"
        type="text"
        placeholder="Digite seu nome"
    >

    <button id="entrar">
        ENTRAR NA FILA
    </button>

    <h2 id="resultado"></h2>


    <script>
alert("JAVASCRIPT FUNCIONOU!");
</script>

        const botao = document.getElementById("entrar");

        const campo = document.getElementById("nome");

        const resultado = document.getElementById("resultado");


        botao.onclick = function() {

            const nome = campo.value;

            resultado.textContent =
                "🎉 " + nome + " entrou na fila!";

        };

    </script>

</body>
</html>
